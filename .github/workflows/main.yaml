# This is a basic workflow to help you get started with Actions

name: melonDS Android Nightly Build

# Controls when the action will run.
on:
  # Triggers the workflow on push to any branch
  push:
    branches: [ '**' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Needed to push the nightly-release tag and update the release with GITHUB_TOKEN
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Prepare signing keystore
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
        run: |
          KS="${{ runner.workspace }}/keystore.jks"
          if [ -n "$MELONDS_KEYSTORE" ] \
             && echo "$MELONDS_KEYSTORE" | base64 -d > "$KS" 2>/dev/null \
             && keytool -list -keystore "$KS" -storepass "$MELONDS_KEYSTORE_PASSWORD" -alias melonds > /dev/null 2>&1; then
            echo "Using the keystore from the MELONDS_KEYSTORE secret"
            echo "KS_PASS=$MELONDS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::MELONDS_KEYSTORE secret is missing or not a valid keystore. Generating a temporary one: every build is signed with a different key, so it cannot be installed over a previous build."
            rm -f "$KS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias melonds -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass melondsci -keypass melondsci -dname "CN=melonDS CI"
            echo "KS_PASS=melondsci" >> "$GITHUB_ENV"
          fi

      - name: Build melonDS Android
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          sed -i -e 's/\(versionName = "\)\(.*\)\("\)/\1\2 ('"$COMMIT"')\3/g' buildSrc/src/main/kotlin/AppConfig.kt
          echo "MELONDS_KEYSTORE=${{runner.workspace}}/keystore.jks" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=$KS_PASS" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=$KS_PASS" >> local.properties
          chmod +x ./gradlew
          ./gradlew :app:regenerateVulkanSpirv :app:assembleGitHubNightlyRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-android
          path: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk

      # The APK is already built at this point, so keep it downloadable even if tagging/releasing fails
      - name: Tag nightly release
        run: |
          git tag -m "Nightly Release" -f -a nightly-release
          git push -f origin refs/tags/nightly-release

      - name: Report Vulkan SPIR-V Header Changes
        if: always()
        run: |
          CHANGED_HEADERS="$(git ls-files -m -- 'melonDS-android-lib/src/*ShaderData.h' 'melonDS-android-lib/src/android/renderer/*ShaderData.h')"
          if [[ -n "$CHANGED_HEADERS" ]]; then
            echo "::warning::Vulkan SPIR-V headers changed during CI build. Commit regenerated headers."
            echo "$CHANGED_HEADERS"
          else
            echo "No Vulkan SPIR-V header changes detected."
          fi

      - name: Update GitHub Nightly Release
        id: update_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly-release
          name: 'Nightly Build'
          body: 'The currently Nightly Build. Whenever new changes are pushed, you can find the latest build here. You can keep this installation alongside your main one.'
          artifacts: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk
          artifactContentType: application/vnd.android.package-archive

